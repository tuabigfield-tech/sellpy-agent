name: Test Alert (one-off)

on:
  workflow_dispatch:

jobs:
  inject-failure-row:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install gspread

      - name: Add test failure row to Google Sheet
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          python - <<'EOF'
          import datetime, json, os
          from zoneinfo import ZoneInfo
          import gspread

          gc = gspread.service_account_from_dict(json.loads(os.environ["GOOGLE_CREDENTIALS_JSON"]))
          ws = gc.open_by_key(os.environ["GOOGLE_SHEET_ID"]).sheet1

          ts = datetime.datetime.now(ZoneInfo("Europe/Stockholm")).strftime("%Y-%m-%d %H:%M:%S")
          ws.append_row([ts, "failure", "TEST_ITEM", 0.0, "", "Simulated failure — alert test"])
          print(f"Test failure row added at {ts}")
          EOF
